<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE DARK - Authentication</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        
        <!-- Left Side: Editorial Banner -->
        <div class="auth-banner">
            <img src="assets/lookbook_editorial.jpg" alt="THE DARK Editorial Lookbook">
            <div class="auth-banner-overlay">
                <h2>THE DARK</h2>
                <p>Welcome to the Inner Archive. Step into the void and access exclusive drops, private silhouettes, and early access.</p>
            </div>
        </div>

        <!-- Right Side: Auth Forms -->
        <div class="auth-panel">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">THE DARK</a>
                <div class="auth-tabs">
                    <button id="tabLogin" class="auth-tab active">SIGN IN</button>
                    <button id="tabRegister" class="auth-tab">CREATE ACCOUNT</button>
                </div>
            </div>

            <!-- Login View -->
            <div id="viewLogin" class="auth-form-view active">
                <form id="formLogin">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="collector@thedark.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <div class="password-input-wrap">
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
                            <button type="button" class="password-toggle">Show</button>
                        </div>
                    </div>
                    
                    <a href="#" class="forgot-password">Forgot password?</a>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="loginRemember" checked>
                        <label for="loginRemember">Keep me signed in</label>
                    </div>

                    <button type="submit" class="btn-primary">SIGN IN</button>

                    <div class="divider">
                        <span>OR CONTINUE WITH</span>
                    </div>

                    <div class="oauth-buttons">
                        <button type="button" class="btn-oauth">Apple</button>
                        <button type="button" class="btn-oauth">Google</button>
                    </div>
                </form>
            </div>

            <!-- Register View -->
            <div id="viewRegister" class="auth-form-view">
                <form id="formRegister">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="regFirstName">First Name</label>
                            <input type="text" id="regFirstName" class="form-control" placeholder="Alex" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="regLastName">Last Name</label>
                            <input type="text" id="regLastName" class="form-control" placeholder="Mercer" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="collector@thedark.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regPassword">Password</label>
                        <div class="password-input-wrap">
                            <input type="password" id="regPassword" class="form-control" placeholder="Minimum 8 characters" required>
                            <button type="button" class="password-toggle">Show</button>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar">
                                <div class="strength-segment" id="strength1"></div>
                                <div class="strength-segment" id="strength2"></div>
                                <div class="strength-segment" id="strength3"></div>
                            </div>
                            <div class="strength-text" id="strengthText">Weak</div>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="regVip">
                        <label for="regVip">Join the VIP Inner Archive. Receive 15% off your first drop and early access to limited silhouettes.</label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="regTerms" required>
                        <label for="regTerms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
                    </div>

                    <button type="submit" class="btn-primary">CREATE ACCOUNT</button>
                </form>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
